plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.setup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.setup'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../setup-release.keystore')
            storePassword 'setup-parent-2026'
            keyAlias 'setup'
            keyPassword 'setup-parent-2026'
        }
    }
    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
        }
    }
}
